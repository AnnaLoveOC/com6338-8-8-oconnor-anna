<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cat-alog!</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>
            <img src="images/paw.svg" alt="" class="paw">
            The Cat-alog!
            <img src="images/paw.svg" alt="" class="paw">
        </h1>
    </header>
    
    <main>

        <!-- CAT BREED SEARCH FORM -->
        <form>
            <label for="catBreed">Enter a cat breed:&nbsp;</label>
            <input type="text" name="catBreed" id="catBreed">
            <button type="submit">Search Cats</button>
        </form>

        <!-- CAT SEARCH RESULTS (FILLED BY JAVASCRIPT) -->
        <section id="catResults"></section>

        <!-- FAVORITE CATS (SAVED USING LOCALSTORAGE) -->
        <section>
            <h2>My Favorite Cats</h2>
            <div id="favoriteCats"></div>
        </section>


    </main>
    <!-- JAVASCRIPT -->
    <script src="index.js"></script>
</body>
</html>
