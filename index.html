<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cat-alog!</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Cat-alog!</h1>
    </header>
    
    <main>

        <!-- CAT BREED SEARCH FORM -->
        <form>
            <label for="catBreed">Enter a cat breed:&nbsp;</label>
            <input type="text" name="catBreed" id="catBreed">
            <button type="submit">Search Cats</button>
        </form>

        <!-- CAT SEARCH RESULTS (FILLED BY JAVASCRIPT) -->
        <div id="catResults">

        </div>

        <!-- FAVORITE CATS (SAVED USING LOCALSTORAGE) -->
        <div id="favoriteCats">

        </div>
    </main>
    <!-- JAVASCRIPT -->
    <script src="index.js"></script>
</body>
</html>
